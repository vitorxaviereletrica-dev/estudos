<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudos – Eng. Civil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec;--card:#fffdf9;--ink:#1c2321;--mut:#6b736f;--bl:#1f4d43;--bl2:#2f6b5c;--am:#d9a441;--rd:#b4442f;--ln:#e6e0d4;--gr:#3c9a5f;
  --sh:0 1px 2px rgba(28,35,33,.04),0 8px 24px -12px rgba(28,35,33,.12);
  --h0:#ebe6db;--h1:#c6e6c9;--h2:#8fd09a;--h3:#4fae67;--h4:#23743e;
}
@media(prefers-color-scheme:dark){
  :root:not(.light){ --bg:#121614;--card:#1b211e;--ink:#ece8df;--mut:#9aa39e;--bl:#7cc4a8;--bl2:#5aa98b;--ln:#2a322e;--rd:#f08a73;--h0:#232a26;--h1:#1f4a2e;--h2:#2a6e3f;--h3:#3f9c58;--h4:#6fd88a }
  :root:not(.light) button{color:#121614}
  :root:not(.light) button.r{background:#c4553f;color:#fff}
  :root:not(.light) .c.ok b{color:#7ed99a}
}
:root.dark{ --bg:#121614;--card:#1b211e;--ink:#ece8df;--mut:#9aa39e;--bl:#7cc4a8;--bl2:#5aa98b;--ln:#2a322e;--rd:#f08a73;--h0:#232a26;--h1:#1f4a2e;--h2:#2a6e3f;--h3:#3f9c58;--h4:#6fd88a }
:root.dark button{color:#121614}
:root.dark button.r{background:#c4553f;color:#fff}
:root.dark .c.ok b{color:#7ed99a}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 'DM Sans',system-ui,sans-serif;padding-bottom:96px;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s,color .3s}
header{background:linear-gradient(135deg,#183b34,#24564a 60%,#2f6b5c);color:#f7f3ea;padding:14px 18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 6px 24px -14px rgba(0,0,0,.5)}
#hd{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}#hd b{font-family:Fraunces,serif;font-weight:700;letter-spacing:.2px}
.bar{height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8c170,var(--am));border-radius:99px}
#hd small{color:#cfe2da}
#tb:empty{display:none}
#tb{max-width:900px;margin:10px auto 0;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap}
#tb button{background:var(--am);color:#1c2321}
main{max-width:900px;margin:0 auto;padding:12px 16px;overflow-x:hidden}
h2{font-family:Fraunces,serif;font-weight:600;font-size:1.25rem;margin:26px 0 10px;letter-spacing:.2px}
nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 20px));display:flex;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:18px;padding:5px;box-shadow:0 12px 32px -14px rgba(0,0,0,.35);z-index:6}
nav button{flex:1;padding:10px 2px;border:0;border-radius:13px;background:none;color:var(--mut);font-size:.72rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button:hover{color:var(--ink)}
nav button.on{color:#fff;background:var(--bl);font-weight:700;box-shadow:none}
:root:not(.light) nav button.on{color:#121614}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.c:hover{box-shadow:0 2px 4px rgba(0,0,0,.04),0 14px 30px -14px rgba(0,0,0,.18)}
.c.col{flex-direction:column;align-items:flex-start;gap:8px}
.c.ok{border-color:color-mix(in srgb,var(--gr) 45%,transparent);background:color-mix(in srgb,var(--gr) 8%,var(--card))}.c.ok b{color:var(--gr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,var(--bg))}
.pb{height:7px;background:var(--ln);border-radius:99px;width:100%;overflow:hidden}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#e8c170,var(--am));border-radius:99px;transition:width .5s}.ok .pb i{background:linear-gradient(90deg,#6cc488,var(--gr))}
.f{display:flex;gap:8px;flex-wrap:wrap;width:100%;max-width:100%}.f.col{flex-direction:column}
.f > * { min-width: 0; max-width: 100%; }
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);width:100%;max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bl2);box-shadow:0 0 0 3px color-mix(in srgb,var(--bl2) 20%,transparent)}
.f:not(.col) input{flex:1 1 160px;width:auto}.f:not(.col) select{width:auto}
button{font:inherit;font-weight:500;padding:10px 16px;border:0;border-radius:10px;background:var(--bl);color:#fff;cursor:pointer;transition:transform .15s,filter .2s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
button.s{padding:6px 12px;font-size:.83rem;border-radius:99px;background:color-mix(in srgb,var(--bl) 10%,var(--card));color:var(--bl);border:1px solid color-mix(in srgb,var(--bl) 22%,transparent)}
button.s:hover{background:var(--bl);color:var(--card)}
button.r,button.s.r{background:var(--rd);color:#fff;border-color:transparent}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:var(--bl);color:#fff;cursor:pointer}
small,.vz{color:var(--mut)}.at{color:var(--rd);font-weight:700}
.cm{white-space:pre-wrap;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin:6px 0 0}
.chip{font-size:.72rem;font-weight:500;padding:3px 10px;border-radius:99px;border:1.5px solid;background:var(--card);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.urg{border-color:var(--rd)!important;color:var(--rd);font-weight:700}
.chip.urg::before{content:'⚠ '}
.gr{width:100%;display:block;color:var(--ink)}
a{color:var(--bl2)}
label{display:flex;flex-direction:column;text-align:left;font-size:.85rem;color:var(--mut);gap:4px}
.dn{max-width:270px;margin:10px auto;color:var(--ink);filter:drop-shadow(0 10px 18px rgba(0,0,0,.12))}.dn svg{width:100%;display:block}
.dn text{font-family:'DM Sans',sans-serif}
@media(min-width:520px){.dn{max-width:320px;margin:14px auto}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal button{padding:9px 0;border-radius:10px;position:relative;font-weight:400;cursor:pointer;background:var(--card);border:1px solid var(--ln);color:var(--ink);display:block}
.cal button.hj{border-color:var(--am);font-weight:700}.cal button.sl{background:var(--bl);color:var(--card);border-color:var(--bl)}
:root:not(.light) .cal button.sl{color:#121614}
.cal u{position:absolute;left:50%;bottom:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--am)}.cal u.ok{background:var(--gr)}
.cal i{display:block}
.ov{position:fixed;inset:0;background:rgba(15,20,18,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9;padding:14px;animation:fd .2s}
.md{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.md>b:first-child{font-family:Fraunces,serif;font-size:1.15rem}
@keyframes fd{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(12px) scale(.98)}}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:500;padding:11px 18px;border-radius:99px;display:none;z-index:40;text-align:center;max-width:92vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}

details{margin:10px 0;background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
summary{padding:14px;cursor:pointer;font-weight:700;background:color-mix(in srgb,var(--bl) 5%,transparent);display:flex;align-items:center;justify-content:flex-start;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▶';font-size:.7em;margin-right:8px;color:var(--mut);transition:transform .2s;flex-shrink:0}
details[open]>summary::before{transform:rotate(90deg)}
details[open]>summary{border-bottom:1px solid var(--ln)}
.tag-folder{margin:8px 12px;border-color:color-mix(in srgb,var(--am) 50%,transparent);border-radius:12px;box-shadow:none}
.tag-folder summary{background:color-mix(in srgb,var(--am) 8%,transparent);padding:9px 12px;font-size:.9em}
.item-acervo{border:none;border-bottom:1px solid var(--ln);border-radius:0;margin:0;padding:12px 14px;box-shadow:none}
.item-acervo:last-child{border-bottom:none}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumb{width:62px;height:62px;border-radius:10px;object-fit:cover;border:1px solid var(--ln);cursor:pointer;transition:transform .2s;background:var(--h0)}
.thumb:hover{transform:scale(1.06)}
.paste-zone{border:2px dashed color-mix(in srgb,var(--bl2) 50%,transparent);border-radius:14px;padding:18px;text-align:center;color:var(--bl2);font-size:.9em;background:color-mix(in srgb,var(--bl2) 5%,transparent);margin-bottom:10px;width:100%;word-break:break-word}
.paste-zone.hl{background:color-mix(in srgb,var(--am) 18%,transparent);border-color:var(--am)}

.heat{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin:18px 0 6px;box-shadow:var(--sh)}
.heat-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.heat-top b{font-family:Fraunces,serif;font-size:1.05rem}
.heat-sc{overflow-x:auto;padding-bottom:4px}
.heat-m,.heat-g{display:grid;grid-auto-flow:column;grid-auto-columns:13px;gap:3px;min-width:max-content}
.heat-m{font-size:.62rem;color:var(--mut);margin-bottom:3px;height:12px}
.heat-m span{white-space:nowrap;overflow:visible}
.heat-g{grid-template-rows:repeat(7,13px)}
.heat i{display:block;width:13px;height:13px;border-radius:3px}
.h0{background:var(--h0)}.h1{background:var(--h1)}.h2{background:var(--h2)}.h3{background:var(--h3)}.h4{background:var(--h4)}
.hx{background:transparent}
.hh{outline:1.5px solid var(--am);outline-offset:1px}
.heat-lg{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:8px}
.heat-lg small{font-size:.68rem;margin:0 4px}
.heat-lg i{width:11px;height:11px}
.heat-g i:not(.hx){cursor:pointer}.heat-g i:not(.hx):hover{outline:1.5px solid var(--ink);outline-offset:1px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.st{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;min-width:0}
.st b{font-family:Fraunces,serif;font-size:1.45rem;line-height:1.1;color:var(--bl)}
.st small{font-size:.72rem}.st.warn b{color:var(--am)}.st.bad b{color:var(--rd)}
.provas{display:flex;gap:8px;overflow-x:auto;margin:8px 0;padding-bottom:4px}
.pv{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:14px;padding:10px 14px 10px 12px;box-shadow:var(--sh);min-width:170px}
.pv-n{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--card));line-height:1}
.pv-n b{font-family:Fraunces,serif;font-size:1.5rem;color:var(--ink)}.pv-n small{font-size:.62rem;margin-top:2px}
.pv-i{display:flex;flex-direction:column;min-width:0}.pv-i b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}.pv-i small{font-size:.75rem}
.pv.warn .pv-n{background:color-mix(in srgb,var(--am) 22%,var(--card))}
.pv.urg{border-color:color-mix(in srgb,var(--rd) 40%,var(--ln));border-left-color:var(--rd)}.pv.urg .pv-n{background:var(--rd)}.pv.urg .pv-n b,.pv.urg .pv-n small{color:#fff}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.ck{flex-direction:row;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--ln);border-radius:99px;cursor:pointer;color:var(--ink)}.ck input{width:auto;margin:0}
.ck:has(input:checked){background:color-mix(in srgb,var(--bl) 12%,var(--card));border-color:var(--bl2)}
.chip[onclick]{cursor:pointer}
.dl{display:flex;flex-direction:column;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.dl>div{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln);font-size:.88rem}.dl>div:last-child{border:0}
.dl>div>span:not(.dot){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--bl2);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.q>.cm{width:100%}.q textarea{min-height:120px}
.alts{display:flex;flex-direction:column;gap:6px;width:100%}
.alt{display:flex;flex-direction:row;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;color:var(--ink);font-size:.95rem;background:var(--card)}
label.alt{cursor:pointer}label.alt input{width:auto;margin:3px 0 0;flex:0 0 auto;accent-color:var(--bl2)}
.alt>b{flex:0 0 auto;color:var(--mut)}.alt>span{flex:1;min-width:0}.alt>small{flex:0 0 auto}
label.alt:has(input:checked){border-color:var(--bl2);background:color-mix(in srgb,var(--bl) 10%,var(--card))}
.alt.certa{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 12%,var(--card))}
.alt.errada{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 10%,var(--card))}
.resp{width:100%;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:10px;padding:8px 10px}
.score{font-family:Fraunces,serif;font-size:2.6rem;line-height:1.1}
.sc-ok{color:var(--gr)}.sc-mid{color:var(--am)}.sc-bad{color:var(--rd)}
details.res{width:100%;margin:4px 0 0;box-shadow:none}.res summary{padding:9px 12px;font-size:.88rem}
nav.n7 button{gap:0}nav.n7 button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}nav.n7 .nl{font-size:.62rem}
@media(max-width:420px){.st b{font-size:1.15rem}.st{padding:10px}}
@media(max-width:520px){
  nav{bottom:calc(8px + env(safe-area-inset-bottom));padding:4px}
  nav button{font-size:.65rem;padding:6px 1px;line-height:1.2}
}

/* Ajustes: contraste no modo escuro + navegação com 7 abas */
html:root:not(#_z) nav button{color:var(--mut);background:none}
html:root:not(#_z) nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--bl) 8%,transparent)}
html:root:not(#_z) nav button.on{background:var(--bl);color:var(--card)}
html:root:not(#_z) .cal button{color:var(--ink)}
html:root:not(#_z) .cal button.sl{color:var(--card)}
html:root:not(#_z) button.s{color:var(--bl)}html:root:not(#_z) button.s:hover{color:var(--card)}
html:root:not(#_z) .ck,html:root:not(#_z) .alt{color:var(--ink)}
nav{width:min(780px,calc(100% - 20px))}
nav button{font-size:.74rem;letter-spacing:.1px}
nav.n7 button span:first-child{font-size:1rem;line-height:1.2}
@media(max-width:520px){nav button{font-size:.62rem}nav.n7 button span:first-child{font-size:.95rem}}
</style>
</head>
<body>
<header><div id="hd"></div><div id="tb"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script type="module">
// =========================================================================
// 1. CONFIGURAÇÃO DO FIREBASE
// =========================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, EmailAuthProvider, linkWithCredential, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUC3Ph1Mn-0WXLMmrIFlUbM7O7-wiEF_g",
  authDomain: "meu-controle-estudos-2a2bb.firebaseapp.com",
  projectId: "meu-controle-estudos-2a2bb",
  storageBucket: "meu-controle-estudos-2a2bb.firebasestorage.app",
  messagingSenderId: "514295721884",
  appId: "1:514295721884:web:9837b6226b318d1d2e6259"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// =========================================================================
// 2. LÓGICA DO APLICATIVO
// =========================================================================
const KEY='estudos_v1',GR='#2e9e5b';
const DC=['#e4572e','#f08a24','#c8403a','#f5b041'],TC=['#2e86ab','#5b9bd5','#3a6ea5','#6fb3b8'];
const DEF={materias:[],itens:[],agenda:[],estudo:{},hist:{},dias:{},diasM:{},pastas:{},bonus:{},timer:null,ciclo:1,cicloInicio:'',xp:0,streak:0,ultimoDia:'',atualizado:0,simulados:[],simAtual:null,cfg:{horas:10,pctDif:80}};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>fmtD(new Date());
function addD(iso,n){const p=iso.split('-').map(Number);return fmtD(new Date(p[0],p[1]-1,p[2]+n))}
const fb=iso=>iso.split('-').reverse().join('/');
const dif=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
function sem(){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return fmtD(x)}
function semanaDe(iso){const p=iso.split('-').map(Number);const x=new Date(p[0],p[1]-1,p[2]);x.setDate(x.getDate()-((x.getDay()+6)%7));return fmtD(x)}
function semanas(n){const o=[],b=sem();for(let i=n-1;i>=0;i--)o.push(addD(b,-7*i));return o}
function hm(ms){const t=Math.round(ms/6e4),h=Math.floor(t/60),m=t%60;return h?h+'h'+(m?pad(m):''):m+'min'}
function clk(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
const normStr = s => String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase();
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}

function isDark() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') return true;
  if (saved === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme() {
  const root = document.documentElement;
  const current = isDark();
  if (current) { root.classList.remove('dark'); root.classList.add('light'); localStorage.setItem('theme', 'light'); }
  else { root.classList.remove('light'); root.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
  render();
}
if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

function norm(r){
  const d=Object.assign(clone(DEF),r);d.cfg=Object.assign({},DEF.cfg,r.cfg);
  ['materias','itens','agenda'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!d.estudo||typeof d.estudo!=='object')d.estudo={};
  const ks=Object.keys(d.estudo);
  if(ks.length&&ks.every(k=>/^\d{4}-\d{2}-\d{2}$/.test(k))){d.estudo=d.estudo[ks.sort().pop()]||{};d.bonus={}}
  if(!d.bonus||typeof d.bonus!=='object')d.bonus={};
  if(!d.hist||typeof d.hist!=='object')d.hist={};
  if(!d.dias||typeof d.dias!=='object')d.dias={};
  if(!d.diasM||typeof d.diasM!=='object')d.diasM={};
  if(!d.pastas||typeof d.pastas!=='object')d.pastas={};
  if(!d.timer||typeof d.timer.mid!=='string'||!(d.timer.st>0))d.timer=null;
  else{
    if(typeof d.timer.acc!=='number')d.timer.acc=0;
    if(typeof d.timer.paused!=='boolean')d.timer.paused=false;
  }
  d.ciclo=Math.max(1,parseInt(d.ciclo)||1);d.atualizado=+d.atualizado||0;
  if(typeof d.cicloInicio!=='string')d.cicloInicio='';
  d.materias.forEach(m=>{
    if(m.dif!=='t')m.dif='d';
    if(!Array.isArray(m.difHist))m.difHist=[];
    if(typeof m.cor!=='string')m.cor='';
    if(!Array.isArray(m.tags))m.tags=[];
  });
  d.itens.forEach(i=>{
    if(typeof i.tag!=='string')i.tag='';
    if(!Array.isArray(i.imagens))i.imagens=[];
    i.imagens = i.imagens.filter(img => img && (img.url || /^[\w-]+$/.test(img.id)));
  });
  
  if(!Array.isArray(d.simulados)) d.simulados=[];
  d.simulados.forEach(x => {
    if (x && !Array.isArray(x.mids)) x.mids = [];
    if (x && !Array.isArray(x.nomes)) x.nomes = [];
  });
  d.simulados=d.simulados.filter(x=>x&&Array.isArray(x.questoes)&&Array.isArray(x.notas));
  
  if(!d.simAtual||!Array.isArray(d.simAtual.questoes)||!Array.isArray(d.simAtual.resp))d.simAtual=null;
  const h=+d.cfg.horas;d.cfg.horas=h>0&&h<=100?h:10;
  const p=+d.cfg.pctDif;d.cfg.pctDif=p>=1&&p<=99?p:80;
  return d;
}

  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.materias)&&Array.isArray(r.itens))return norm(r)}catch(e){}
  return clone(DEF);
}

async function initFirebase() {
  onAuthStateChanged(auth, async (u) => {
    if (u) {
      user = u;
      setMsg('Nuvem: puxando dados...');
      try {
        const snap = await getDoc(doc(db, "estudos", user.uid));
        if (snap.exists()) {
          const remote = norm(snap.data());
          if (remote.atualizado > S.atualizado && !localChanged) {
            S = remote;
            gravaLocal();
            setMsg('Nuvem: dados carregados ✔');
          } else if (S.atualizado > remote.atualizado) {
            await setDoc(doc(db, "estudos", user.uid), S);
            setMsg('Nuvem: dados locais enviados ✔');
          } else {
            setMsg('Nuvem: sincronizado ✔');
          }
        } else {
          await setDoc(doc(db, "estudos", user.uid), S);
          setMsg('Nuvem: backup criado ✔');
        }
        firestoreSynced = true;
      } catch (e) {
        console.error(e);
        setMsg('Nuvem: erro na conexão');
      }
      render();
    } else {
      try {
        await signInAnonymously(auth);
      } catch (e) {
        console.error("Erro no login anônimo", e);
        setMsg('Nuvem: erro ao conectar');
        render();
      }
    }
  });
}

/* ---------- FOGOS ---------- */
function fogos(){
  if(!document.body||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:30';
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d');if(!x){c.remove();return}
  const P=[],t0=performance.now();let n=0;
  const burst=(cx,cy)=>{const h=Math.random()*360;for(let i=0;i<46;i++){const a=Math.PI*2*i/46,v=2+Math.random()*3.5;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:h+Math.random()*40})}};
  burst(c.width*.5,c.height*.35);
  (function f(t){
    const e=t-t0;
    if(n<4&&e>400*(n+1)){n++;burst(c.width*(.2+Math.random()*.6),c.height*(.15+Math.random()*.35))}
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.l-=.011;if(p.l>0){x.globalAlpha=p.l;x.fillStyle='hsl('+p.h+',100%,60%)';x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()}});
    if(e<2200||P.some(p=>p.l>0))requestAnimationFrame(f);else c.remove();
  })(t0);
}

/* ---------- CICLO ---------- */
function plano(){
  const a=S.materias.filter(m=>m.status==='andamento').sort((x,y)=>(x.dif==='d'?0:1)-(y.dif==='d'?0:1)||y.peso-x.peso);
  const nd=a.filter(m=>m.dif==='d').length,nt=a.length-nd;
  let pd=S.cfg.pctDif/100;if(!nd)pd=0;else if(!nt)pd=1;
  const H=S.cfg.horas;
  return {pd:pd,l:a.map(m=>({m:m,h:+(m.dif==='d'?H*pd/nd:H*(1-pd)/nt).toFixed(6)}))};
}
function novoCor(dif,excludeId){
  const pool=dif==='d'?DC:TC;const usados={};
  S.materias.forEach(m=>{if(m.id===excludeId)return;if(m.cor&&pool.includes(m.cor))usados[m.cor]=(usados[m.cor]||0)+1});
  let best=pool[0],minC=Infinity;
  pool.forEach(c=>{const n=usados[c]||0;if(n<minC){minC=n;best=c}});
  return best;
}
function cores(){
  const o={};let mudou=false;
  plano().l.forEach(p=>{if(!p.m.cor){p.m.cor=novoCor(p.m.dif,p.m.id);mudou=true}o[p.m.id]=p.m.cor});
  if(mudou)save();
  return o;
}
function timerElapsed(){
  if(!S.timer)return 0;
  if(S.timer.paused)return S.timer.acc||0;
  return (S.timer.acc||0)+(Date.now()-S.timer.st);
}
function est(id){
  let v=S.estudo[id]||0;
  if(S.timer&&S.timer.mid===id)v+=timerElapsed();
  return v;
}
function reg(id,ms){
  S.estudo[id]=(S.estudo[id]||0)+ms;
  S.dias[hoje()]=(S.dias[hoje()]||0)+ms;regDM(hoje(),id,ms);
  const k=sem(),w=S.hist[k]=S.hist[k]||{};w[id]=(w[id]||0)+ms;
}
function regDM(d,mid,ms){const x=S.diasM[d]=S.diasM[d]||{};x[mid]=(x[mid]||0)+ms}
function chips(C){
  const h=hoje(),l=S.materias.filter(m=>m.status==='andamento'&&m.prova&&m.prova>=h).sort((a,b)=>a.prova.localeCompare(b.prova));
  if(!l.length)return '';
  return '<div class="provas">'+l.map(m=>{const n=dif(m.prova,h);const cls=n<=3?' urg':n<=10?' warn':'';const dt=new Date(m.prova+'T12:00');const wd=['dom','seg','ter','qua','qui','sex','sáb'][dt.getDay()];
    return '<div class="pv'+cls+'" style="--c:'+(C[m.id]||'var(--bl2)')+'"><div class="pv-n">'+(n===0?'<b>Hoje</b>':'<b>'+n+'</b><small>'+(n===1?'dia':'dias')+'</small>')+'</div><div class="pv-i"><b>'+esc(m.nome)+'</b><small>'+wd+', '+fb(m.prova)+'</small></div></div>'}).join('')+'</div>';
}
function metaCheck(m){
  const p=plano().l.find(x=>x.m.id===m.id);if(!p)return '';
  const k=S.ciclo+':'+m.id;
  if(est(m.id)>=p.h*36e5&&!S.bonus[k]){S.bonus[k]=1;fogos();return m.nome+': meta do ciclo batida! '+ganha(20*m.peso)}
  return '';
}
function fechaCiclo(){
  const P=plano().l;
  if(!P.length||!P.every(p=>est(p.m.id)>=p.h*36e5))return '';
  const n=S.ciclo; S.ciclo++;
  
  const newEstudo = {};
  P.forEach(p => {
    const meta = p.h * 36e5;
    const spent = est(p.m.id);
    if (spent > meta) newEstudo[p.m.id] = spent - meta;
  });
  S.estudo = newEstudo;
  
  S.cicloInicio=hoje();fogos();
  return 'Ciclo '+n+' concluído! 🏆 '+ganha(50);
}

/* ---------- HEATMAP ---------- */
function heatmap(){
  const h=hoje(),N=26,start=addD(sem(),-7*(N-1));let cells='',mon='',tot=0,dd=0,lastM=-1;
  const today=new Date();
  for(let w=0;w<N;w++){
    const ws=addD(start,7*w),mo=+ws.split('-')[1]-1;
    mon+='<span>'+(mo!==lastM?MESES[mo].slice(0,3):'')+'</span>';lastM=mo;
    for(let d=0;d<7;d++){
      const k=addD(ws,d);if(k>h){cells+='<i class="hx"></i>';continue}
      let ms=S.dias[k]||0;if(k===h&&S.timer)ms+=timerElapsed();
      const min=ms/6e4;if(min>0){tot+=min;dd++}
      const lv=min<=0?0:min<30?1:min<60?2:min<120?3:4;
      cells+='<i onclick="verDia(\''+k+'\')" class="h'+lv+(k===h?' hh':'')+'" title="'+fb(k)+' · '+(min>0?hm(ms):'sem estudo')+'"></i>';
    }
  }
  return '<div class="heat"><div class="heat-top"><b>Dias estudados</b><small>toque num dia para ver detalhes · '+dd+' dia(s) · '+hm(tot*6e4)+' nos últimos 6 meses</small></div><div class="heat-sc"><div class="heat-m">'+mon+'</div><div class="heat-g">'+cells+'</div></div><div class="heat-lg"><small>menos</small><i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i><small>mais</small></div></div>';
}
function msDia(k){let ms=S.dias[k]||0;if(k===hoje()&&S.timer)ms+=timerElapsed();return ms}
function resumo(){
  const h=hoje(),ws=sem();let sw=0;for(let i=0;i<7;i++){const k=addD(ws,i);if(k<=h)sw+=msDia(k)}
  const pend=S.agenda.filter(a=>!a.feito&&a.data<=h&&mat(a.mid)),late=pend.filter(a=>a.data<h).length;
  const prox=S.agenda.filter(a=>!a.feito&&a.data>h&&mat(a.mid)).length;
  return '<div class="sum"><div class="st"><small>Hoje</small><b>'+hm(msDia(h))+'</b></div><div class="st"><small>Esta semana</small><b>'+hm(sw)+'</b></div><div class="st'+(late?' bad':pend.length?' warn':'')+'"><small>Revisões pendentes</small><b>'+pend.length+'</b><small>'+(late?late+' atrasada(s)':prox+' agendada(s) à frente')+'</small></div></div>';
}
function pendentes(){

function revAdd(){const d=$('#rx').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast('Data inválida');return}if(!revExtra.includes(d))revExtra.push(d);revExtra.sort();$('#rxl').innerHTML=revExtra.map(x=>'<span class="chip" onclick="rmRevAdd(\''+x+'\')">'+fb(x)+' ✕</span>').join('')}

/* ---------- CRONÔMETRO ---------- */
function iniciar(id){
  if(S.timer&&S.timer.mid===id){if(S.timer.paused)retomar();return}
  if(S.timer){
    const n=(mat(S.timer.mid)||{nome:'?'}).nome;
    if(!confirm('Parar o cronômetro de "'+n+'" e iniciar outro?'))return;
    parar();
  }
  S.timer={mid:id,st:Date.now(),paused:false,acc:0};
  save();render();
}
function pausar(){
  if(!S.timer||S.timer.paused)return;
  S.timer.acc+=(Date.now()-S.timer.st);
  S.timer.paused=true;
  const m=mat(S.timer.mid);const msg=m?metaCheck(m):'';
  save();render();
  if(msg)toast(msg);
}
function retomar(){
  if(!S.timer||!S.timer.paused)return;
  S.timer.st=Date.now();S.timer.paused=false;
  save();render();
}
function parar(){
  if(!S.timer)return;
  const m=mat(S.timer.mid),msgs=[];
  let e=S.timer.paused?(S.timer.acc||0):((S.timer.acc||0)+(Date.now()-S.timer.st));
  if(e>4*36e5&&!confirm('O cronômetro ficou ligado por '+hm(e)+'. Salvar esse tempo todo?'))e=0;
  S.timer=null;
  if(m&&e>=1000){reg(m.id,e);if(e>=6e4)streak();msgs.push(ganha(Math.floor(e/6e5)*m.peso),metaCheck(m))}
  msgs.push(fechaCiclo());
  save();render();
  const t=msgs.filter(Boolean).join(' · ');
  if(t)toast(t);
}
function tbar(){
  if(!S.timer)return '';
  const m=mat(S.timer.mid);if(!m)return '';
  const ic=S.timer.paused?'⏸':'⏱';
  const est=S.timer.paused?' pausado':'';
  const btn=S.timer.paused
    ?'<button class="s" onclick="retomar()">▶ Retomar</button>'
    :'<button class="s" onclick="pausar()">⏸ Pausar</button>';
  return '<span>'+ic+' <b>'+esc(m.nome)+'</b> <span id="tv">'+clk(timerElapsed())+'</span>'+est+'</span>'+btn+' <button class="s r" onclick="parar()">⏹ Parar</button>';
}
function tick(){
  if(!S.timer||S.timer.paused)return;
  const m=mat(S.timer.mid);if(!m){S.timer=null;save();render();return}
  const tv=$('#tv');if(tv)tv.textContent=clk(timerElapsed());
  const msg=metaCheck(m);if(msg){save();render();toast(msg)}
}
setInterval(tick,1000);

/* ---------- GRÁFICOS ---------- */
function barras(v,W8,col){
  const bw=26,gap=10,H=100,x0=8,mx=Math.max.apply(null,v.concat([1]));let b='';
  v.forEach((x,i)=>{
    const bh=x/mx*H,xx=x0+i*(bw+gap),cx=xx+bw/2;
    if(x>0) b+='<rect x="'+xx+'" y="'+(14+H-bh).toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+col+'"/>';
    else b+='<rect x="'+xx+'" y="'+(14+H-1.5)+'" width="'+bw+'" height="1.5" rx="1" fill="'+col+'" opacity="0.3"/>';
    if(x>0)b+='<text x="'+cx+'" y="'+(11+H-bh).toFixed(1)+'" text-anchor="middle" font-size="9" fill="currentColor">'+(+x.toFixed(1))+'h</text>';
    b+='<text x="'+cx+'" y="'+(H+27)+'" text-anchor="middle" font-size="8" fill="#8895a7">'+W8[i].slice(8)+'/'+W8[i].slice(5,7)+'</text>';
  });
  return '<svg class="gr" viewBox="0 0 '+(x0*2+v.length*(bw+gap)-gap)+' '+(H+32)+'"><line x1="0" x2="'+(x0*2+v.length*(bw+gap)-gap)+'" y1="'+(14+H)+'" y2="'+(14+H)+'" stroke="#8895a7" stroke-width=".5"/>'+b+'</svg>';
}
function vGraf(){
  const ms=S.materias.filter(m=>m.status==='andamento'||Object.keys(S.hist).some(k=>(S.hist[k][m.id]||0)>0));
  if(!ms.length)return '<p class="vz">Cadastre matérias e estude com o cronômetro para ver os gráficos.</p><button onclick="go(\'mat\')">＋ Cadastrar matéria</button>';
  const W8=semanas(8),C=cores(),cur=sem();
  return '<h2>Horas por semana</h2><p class="vz" style="margin:0">Últimas 8 semanas (a semana começa na segunda). A última barra é a semana atual.</p>'+ms.map(m=>{
    const col=C[m.id]||'#8895a7';
    const v=W8.map(w=>((S.hist[w]||{})[m.id]||0)/36e5+(w===cur&&S.timer&&S.timer.mid===m.id?timerElapsed()/36e5:0));
    const tot=v.reduce((a,b)=>a+b,0);
    return '<div class="c col"><div class="row"><span class="dot" style="background:'+col+'"></span><b>'+esc(m.nome)+'</b></div>'+barras(v,W8,col)+'<small>Total: '+hm(tot*36e5)+' · média '+hm(tot/8*36e5)+'/semana · estudou em '+v.filter(x=>x>0).length+' de 8 semanas</small></div>';
  }).join('');
}

async function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        const MAX = 1600;
        if (width > MAX || height > MAX) {
          if (width > height) { height = Math.round((height * MAX) / width); width = MAX; }
          else { width = Math.round((width * MAX) / height); height = MAX; }
        }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg' })), 'image/jpeg', 0.8);
      };
    };
  });
}

async function enviarArquivo(file, m) {
  if(!user) throw new Error('Sem conexão com a nuvem');
  if (file.size > 100 * 1048576) throw new Error('Arquivo maior que 100MB');

  const path = `users/${user.uid}/materias/${m.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
  const storageRef = ref(storage, path);
  
  await uploadBytes(storageRef, file);
  const url = await getDownloadURL(storageRef);
  
  return { id: storageRef.fullPath, nome: file.name, url: url };
}

function iaCfg(){

/* --- cofre local da chave --- */
function iaDb(){return new Promise((ok,er)=>{const r=indexedDB.open(IA_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)})}
async function iaKv(k,v){
  const db=await iaDb();
  return new Promise((ok,er)=>{const st=db.transaction('kv',v===undefined?'readonly':'readwrite').objectStore('kv'),r=v===undefined?st.get(k):st.put(v,k);r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
}
async function iaMestra(criar){
  let k=await iaKv('mestra');
  if(!k&&criar){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await iaKv('mestra',k)}
  return k;
}
const b64=u=>{let s='';new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function iaGuardaChave(prov,chave){
  if(!window.isSecureContext||!window.crypto||!crypto.subtle||!window.indexedDB)throw new Error('este endereço não permite guardar a chave com segurança (abra o app por https://)');
  const k=await iaMestra(true),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(chave));
  const c=iaCfg();c.enc[prov]={iv:b64(iv),ct:b64(ct)};c.dica[prov]=chave.slice(-4);iaSalvaCfg(c);
}
async function iaLeChave(prov){
  const e=iaCfg().enc[prov];if(!e)return '';
  try{
    const k=await iaMestra(false);if(!k)throw 0;
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv)},k,unb64(e.ct)));
  }catch(x){throw new Error('não consegui abrir a chave salva (os dados do navegador podem ter sido limpos). Cadastre a chave de novo em Config')}
}

/* --- chamadas às APIs --- */
function iaErro(s,t){
  let m='';try{m=JSON.parse(t).error.message||''}catch(e){m=String(t||'').slice(0,160)}
  const d=s===401||s===403?'chave inválida ou sem permissão':s===404?'modelo não encontrado (confira o nome em Config)':s===429?'limite de uso ou cota atingido':s>=500?'o serviço está instável, tente de novo':'erro '+s;
  return d+(m?' — '+String(m).slice(0,200):'');
}
function iaJSON(t){
  t=String(t||'').trim();
  try{return JSON.parse(t)}catch(e){}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw new Error('a IA respondeu num formato inesperado — tente de novo');
}
async function iaChamar(sistema,usuario,schema,nome,prov,model){
  const chave=await iaLeChave(prov);if(!chave)throw new Error('cadastre a chave em Config');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),240000);
  const post=(url,h,b)=>fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},h),body:JSON.stringify(b),signal:ctl.signal});
  try{
    if(prov==='gemini'){
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',h={'x-goog-api-key':chave};
      const b={systemInstruction:{parts:[{text:sistema}]},contents:[{role:'user',parts:[{text:usuario}]}],generationConfig:{responseMimeType:'application/json',responseJsonSchema:schema}};
      let r=await post(url,h,b);
      if(r.status===400){
        const t=await r.text();
        if(!/schema/i.test(t))throw new Error(iaErro(400,t));
        delete b.generationConfig.responseJsonSchema;
        b.contents[0].parts[0].text+='\n\nResponda APENAS com um JSON válido que siga este JSON Schema:\n'+JSON.stringify(schema);
        r=await post(url,h,b);
      }
      if(!r.ok)throw new Error(iaErro(r.status,await r.text()));
      const j=await r.json(),c=j.candidates&&j.candidates[0];
      if(!c||!c.content)throw new Error(j.promptFeedback&&j.promptFeedback.blockReason?'pedido bloqueado pelo filtro do Gemini ('+j.promptFeedback.blockReason+')':'o Gemini não devolveu resposta'+(c&&c.finishReason?' ('+c.finishReason+')':''));
      if(c.finishReason==='MAX_TOKENS')throw new Error('a resposta foi cortada por ser longa demais — tente menos questões');
      return iaJSON((c.content.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join(''));
    }
    const r=await post('https://api.openai.com/v1/responses',{Authorization:'Bearer '+chave},{model:model,instructions:sistema,input:usuario,store:false,text:{format:{type:'json_schema',name:nome,strict:true,schema:schema}}});
    if(!r.ok)throw new Error(iaErro(r.status,await r.text()));
    const j=await r.json();
    if(j.status==='incomplete')throw new Error('a resposta veio incompleta'+(j.incomplete_details&&j.incomplete_details.reason==='max_output_tokens'?' (longa demais — tente menos questões)':''));
    let txt=typeof j.output_text==='string'?j.output_text:'';
    if(!txt)(j.output||[]).forEach(o=>(o.content||[]).forEach(p=>{if(p.type==='output_text')txt+=p.text;if(p.type==='refusal')throw new Error('o modelo recusou: '+p.refusal)}));
    return iaJSON(txt);
  }catch(e){
    if(e.name==='AbortError')throw new Error('a IA demorou mais de 4 minutos — tente com menos questões');
    if(e instanceof TypeError)throw new Error('sem conexão com o serviço ('+e.message+')');
    throw e;
  }finally{clearTimeout(to)}
}
async function iaListar(p,chave){

function simContexto(m,usarAcervo){

function simValida(arr,ms){
  if(!Array.isArray(arr))return [];
  const out=[];
  arr.forEach(q=>{
    if(!q||typeof q.enunciado!=='string'||!q.enunciado.trim())return;
    const nm=normStr(q.materia),m=ms.find(x=>normStr(x.nome)===nm)||ms.find(x=>nm&&(normStr(x.nome).includes(nm)||nm.includes(normStr(x.nome))))||ms[0];
    const base={mid:m.id,topico:String(q.topico||'').trim().slice(0,80),enunciado:q.enunciado.trim().slice(0,4000),resolucao:String(q.resolucao||'').trim().slice(0,4000),criterios:String(q.criterios||'').trim().slice(0,1500)};
    if(q.tipo==='objetiva'){
      const alts=(Array.isArray(q.alternativas)?q.alternativas:[]).map(a=>String(a).replace(/^\s*\(?[A-Ea-e][\)\.:\-–]\s+/,'').trim()).filter(Boolean);
      const c=parseInt(q.correta);
      if(alts.length<3||alts.length>6||!(c>=0&&c<alts.length)||new Set(alts.map(normStr)).size!==alts.length)return;
      const ord=alts.map((_,i)=>i);
      for(let i=ord.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]]}
      out.push(Object.assign(base,{tipo:'objetiva',alternativas:ord.map(i=>alts[i].slice(0,800)),correta:ord.indexOf(c)}));
    }else if(q.tipo==='discursiva'&&base.resolucao){
      out.push(Object.assign(base,{tipo:'discursiva',alternativas:[],correta:-1}));
    }
  });
  return out;
}

  const hist=S.simulados.length?'<h2>Histórico</h2>'+S.simulados.map(r=>'<div class="c" onclick="simAbrir(\''+r.id+'\')" style="cursor:pointer"><div style="min-width:0"><b>'+esc(r.titulo)+'</b><br><small>'+fb(r.data)+' · '+r.questoes.length+' questões · '+esc((r.mids || []).map(id=>simNomeM(id,r)).join(', '))+'</small></div><div style="text-align:right;flex:0 0 auto"><b class="'+simCls(r.pct)+'">'+Math.round(r.pct*100)+'%</b><br><small>+'+r.xp+' XP</small></div></div>').join(''):'';
  return '<h2>Novo simulado</h2><div class="c col">'
   +'<small>Matérias</small><div class="cks">'+ms.map(m=>'<label class="ck"><input type="checkbox" class="simm" value="'+m.id+'"'+(sel.includes(m.id)?' checked':'')+'> '+esc(m.nome)+(simEstudou(m.id)?'':' <small>(ainda sem estudo)</small>')+'</label>').join('')+'</div>'
   +'<div class="f"><label style="flex:1 1 90px">Questões<select id="sn">'+[5,10,15,20].map(x=>opt(x,x,f.n||10)).join('')+'</select></label>'
   +'<label style="flex:1 1 130px">Tipo<select id="st">'+opt('misto','Misto',f.tipo||'misto')+opt('objetiva','Só objetivas',f.tipo)+opt('discursiva','Só discursivas',f.tipo)+'</select></label>'
   +'<label style="flex:1 1 150px">Nível<select id="sl">'+opt('auto','Automático (pela dificuldade)',f.nivel||'auto')+opt('facil','Fácil',f.nivel)+opt('medio','Médio',f.nivel)+opt('dificil','Difícil (+30% XP)',f.nivel)+'</select></label></div>'
   +'<label>Foco (opcional)<input id="sf" maxlength="300" placeholder="Ex.: momento fletor em vigas biapoiadas" value="'+esc(f.foco||'')+'"></label>'
   +(pv.length>1?'<label>IA<select id="sp">'+pv.map(p=>opt(p,IA_PROV[p].nome+' · '+esc(c.model[p]),prov)).join('')+'</select></label>':'<input type="hidden" id="sp" value="'+prov+'"><small>IA: '+IA_PROV[prov].nome+' · '+esc(c.model[prov])+'</small>')
   +'<div class="cks"><label class="ck"><input type="checkbox" id="sa"'+(f.acv!==false?' checked':'')+'> Usar meu acervo como contexto</label><label class="ck"><input type="checkbox" id="sc"'+(f.tempo?' checked':'')+'> Contar o tempo como estudo</label></div>'
   +'<button onclick="simGerar()" style="width:100%;padding:12px">✨ Gerar simulado</button>'
   +'<small>XP: até 4 por questão, proporcional ao acerto, + bônus (70%: +15 · 90%: +35 · 100%: +50). Objetivas são corrigidas no aparelho; discursivas, pela IA.</small></div>'
   +hist;
}
function vSimProva(){
  const A=S.simAtual,nr=A.questoes.filter((q,i)=>simRespondida(A,i)).length;
  return '<h2>'+esc(A.titulo)+'</h2><p class="vz" style="margin-top:-4px">'+esc(IA_PROV[A.prov].nome+' · '+A.model)+' · <span id="simprog">'+nr+'/'+A.questoes.length+' respondidas</span> · suas respostas ficam salvas</p>'
   +A.questoes.map((q,i)=>'<div class="c col q"><div class="row"><b>Questão '+(i+1)+'</b><small>'+esc(simNomeM(q.mid,A))+(q.topico?' · '+esc(q.topico):'')+(q.tipo==='discursiva'?' · discursiva':'')+'</small></div><div class="cm">'+esc(q.enunciado)+'</div>'
     +(q.tipo==='objetiva'
       ?'<div class="alts">'+q.alternativas.map((a,j)=>'<label class="alt"><input type="radio" name="sq'+i+'"'+(A.resp[i]===j?' checked':'')+' onchange="simResp('+i+','+j+')"><b>'+'ABCDEF'[j]+'</b><span class="cm">'+esc(a)+'</span></label>').join('')+'</div>'
       :'<textarea rows="5" placeholder="Sua resposta (mostre o raciocínio e as contas)" oninput="simResp('+i+',this.value)">'+esc(A.resp[i])+'</textarea>')
     +'</div>').join('')
   +'<div class="f" style="margin:14px 0"><button onclick="simCorrigir()" style="flex:1;padding:12px">✅ Entregar e corrigir</button><button class="s r" onclick="simDescartar()">Descartar</button></div>';
}
function vSimRes(r){
  const p=Math.round(r.pct*100),pts=r.notas.reduce((a,b)=>a+b,0),porM={};
  r.questoes.forEach((q,i)=>{const x=porM[q.mid]=porM[q.mid]||{t:0,p:0,er:0};x.t++;x.p+=r.notas[i];if(r.notas[i]<.5)x.er++});
  return '<div class="row" style="justify-content:space-between;margin-top:14px"><button class="s" onclick="go(\'sim\')">‹ Simulados</button><small>'+fb(r.data)+' · '+hm(r.dur)+' · '+esc(r.model)+'</small></div>'
   +'<div class="c col" style="align-items:center;text-align:center"><b class="score '+simCls(r.pct)+'">'+p+'%</b><small>'+(+pts.toFixed(2))+' de '+r.questoes.length+' pontos · +'+r.xp+' XP</small><div class="cm" style="text-align:left;width:100%">'+esc(r.resumo)+'</div></div>'
   +'<div class="dl">'+Object.keys(porM).map(k=>{const x=porM[k],m=mat(k);return '<div><span>'+esc(simNomeM(k,r))+'</span><b class="'+simCls(x.p/x.t)+'">'+Math.round(x.p/x.t*100)+'%</b>'+(m&&x.er&&m.status==='andamento'?'<button class="s" onclick="simRevisar(\''+r.id+'\',\''+k+'\')">📅 Revisar erros</button>':'')+'</div>'}).join('')+'</div>'
   +'<h2>Gabarito comentado</h2>'+r.questoes.map((q,i)=>simQRes(r,q,i)).join('')
   +'<div class="f" style="margin:14px 0"><button onclick="go(\'sim\')" style="flex:1">✨ Novo simulado</button><button class="s r" onclick="simApagar(\''+r.id+'\')">Apagar do histórico</button></div>';
}
function simQRes(r,q,i){
  const n=r.notas[i]||0,ic=n>=1?'✔':n>0?'◐':'✘';
  let h='<div class="cm">'+esc(q.enunciado)+'</div>';
  if(q.tipo==='objetiva')h+='<div class="alts">'+q.alternativas.map((a,j)=>'<div class="alt'+(j===q.correta?' certa':j===r.resp[i]?' errada':'')+'"><b>'+'ABCDEF'[j]+'</b><span class="cm">'+esc(a)+'</span>'+(j===r.resp[i]?'<small>sua</small>':'')+'</div>').join('')+'</div>'+(r.resp[i]<0?'<small class="at">Sem resposta</small>':'');
  else h+='<small><b>Sua resposta</b></small><div class="cm resp">'+(String(r.resp[i]).trim()?esc(r.resp[i]):'<i>sem resposta</i>')+'</div>'+(r.com[i]?'<small><b>Correção:</b> '+esc(r.com[i])+'</small>':'');
  h+='<details class="res"><summary>Resolução</summary><div class="cm" style="padding:10px 12px">'+esc(q.resolucao)+'</div></details>';
  return '<div class="c col"><div class="row"><b class="'+simCls(n)+'">'+ic+' Questão '+(i+1)+'</b><small>'+esc(simNomeM(q.mid,r))+(q.topico?' · '+esc(q.topico):'')+' · '+(+n.toFixed(2))+' pt</small></div>'+h+'</div>';
}

/* ---------- CONFIG / BACKUP ---------- */
function vCfg(){
  let accHtml = '';
  if (user) {
    if (user.isAnonymous) {
      accHtml = `
        <div class="c col">
          <small>Seus dados estão seguros neste aparelho, mas se você limpar o cache ou trocar de celular, perderá o acesso à sua conta anônima.</small>
          <label>E-mail para vincular<input id="acc_email" type="email" placeholder="seu@email.com"></label>
          <label>Senha (mínimo 6 caracteres)<input id="acc_pw" type="password"></label>
          <div class="f">
            <button onclick="vincularConta()">Criar Conta Permanente</button>
            <button class="s" onclick="fazerLogin()">Já tenho conta (Fazer Login)</button>
          </div>
        </div>
      `;
    } else {
      accHtml = `
        <div class="c col ok">
          <b>Conta vinculada e segura 🔒</b>
          <small>Logado como: ${esc(user.email)}</small>
          <button class="s r" onclick="sairConta()">Sair / Trocar de conta</button>
        </div>
      `;
    }
  } else {
    accHtml = '<p class="vz">Conectando à nuvem...</p>';
  }

  return '<h2>Ciclo de estudos</h2><div class="f col"><label>Horas líquidas de estudo em um ciclo<input id="ch" type="number" step="0.5" min="1" max="100" value="'+S.cfg.horas+'"></label><label>% do tempo para matérias com dificuldade (o resto vai para as tranquilas)<input id="cp" type="number" min="1" max="99" value="'+S.cfg.pctDif+'"></label><button onclick="saveCfg()">Salvar</button></div><p class="vz">O ciclo só reinicia quando todas as matérias baterem a meta. Mudar as horas nunca apaga o que você já estudou.</p>'
   +'<h2>Conta e Segurança</h2>' + accHtml
   +'<h2>Nuvem (Firebase)</h2><p class="vz sy">'+esc(msgSync)+'</p><p class="vz">Seus dados são salvos de forma segura e sincronizados com o Firebase.</p>'
   +vIACfg()
   +'<h2>Backup manual</h2><button onclick="exp()">Exportar JSON</button> <label class="btn" style="display:inline-block;color:#fff">Importar<input type="file" accept=".json,application/json" hidden onchange="imp(event)"></label>'
   +'<h2>Começar do zero</h2><p class="vz">Apaga matérias, atividades, revisões, horas e XP.</p><button class="r" onclick="zerar()">Zerar tudo</button>';
}

function zerar(){
  if(!confirm('Apagar TODAS as matérias, atividades, revisões, horas e XP?\n\nUm backup será baixado antes.'))return;
  if(!confirm('Tem certeza? Isso não pode ser desfeito.'))return;
  exp();
  const cfg=S.cfg;
  S=clone(DEF);S.cfg=cfg;
  tab='ciclo';save();render();toast('Tudo zerado. Pode começar!');
}
function saveCfg(){
  const h=+$('#ch').value,p=Math.round(+$('#cp').value);
  if(!(h>0&&h<=100)||!(p>=1&&p<=99)){toast('Horas entre 1 e 100 e porcentagem entre 1 e 99');return}
  S.cfg.horas=h;S.cfg.pctDif=p;const t=fechaCiclo();save();render();toast(t||'Ciclo atualizado');
}
function exp(){
  const d=clone(S);d.timer=null;
  const b=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='estudos-backup-'+hoje()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function imp(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.materias)||!Array.isArray(d.itens))throw new Error();
      if(!confirm('Substituir os dados atuais pelos do arquivo?'))return;
      const t=S.timer;S=norm(d);S.timer=t;save();render();toast('Backup importado');
    }catch(x){alert('Arquivo inválido.')}
  };
  r.readAsText(f);e.target.value='';
}

/* ---------- RENDER ---------- */
function render(){
  const h=hoje(),sq=(S.ultimoDia===h||S.ultimoDia===addD(h,-1))?S.streak:0;
  $('#hd').innerHTML=`
    <div style="flex:1">
      <b>Nível ${nivelXP()}</b> · ${S.xp} XP · 🔥 ${sq} dia(s) seguidos
      <div class="bar"><i style="width:${S.xp%100}%"></i></div>
      <small class="sy">${esc(msgSync)}</small>
    </div>
    <button class="s" style="background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; padding:0; font-size:1.2rem; flex-shrink:0; margin-top:4px;" onclick="toggleTheme()" title="Mudar tema">${isDark()?'☀️':'🌙'}</button>
  `;
  $('#tb').innerHTML=tbar();
  const n7=iaOn();$('#nav').classList.toggle('n7',n7);
  $('#nav').innerHTML=[['ciclo','📚 Ciclo'],['agenda','📅 Agenda'],['mat','📋 Matérias'],['acervo','📁 Acervo'],['graf','📊 Gráficos']].concat(n7?[['sim','🧠 Simulado']]:[],[['cfg','⚙ Config']]).map(a=>'<button class="'+(tab===a[0]?'on':'')+'" onclick="go(\''+a[0]+'\')">'+(n7?'<span>'+a[1].replace(' ','</span><span class="nl">'):a[1])+'</span></button>'.slice(n7?0:7)).join('');
  if(tab==='sim'&&!iaOn())tab='cfg';
  $('#app').innerHTML={ciclo:vCiclo,agenda:vAgenda,mat:vMat,acervo:vAcervo,graf:vGraf,sim:vSim,cfg:vCfg}[tab]();
  {const hs=$('.heat-sc');if(hs)hs.scrollLeft=hs.scrollWidth}
  
  if(tab==='acervo') {
    updateTagsSelect();
    renderPreview();
    lista();
    
    const pz = $('#paste-zone');
    if(pz) {
      pz.onclick = () => $('#ap').click();
      pz.ondragover = e => { e.preventDefault(); pz.classList.add('hl'); };
      pz.ondragleave = () => pz.classList.remove('hl');
      pz.ondrop = e => {
        e.preventDefault(); pz.classList.remove('hl');
        handleFileSelect({target: {files: e.dataTransfer.files, value: ''}});
      };
    }
  }
}

// === LIBERANDO AS FUNÇÕES PARA OS BOTÕES DO HTML ===
Object.assign(window, {
  toggleTheme, go, vincularConta, fazerLogin, sairConta, saveCfg, exp, imp, zerar,
  selDia, mesNav, agendar, feito, delAg, iniciar, pausar, retomar, parar, tempoManual,
  revEsp, reavaliar, mudaDif, editMat, setSt, delMat, addMat, updateTagsSelect,
  addTagPrompt, rmTagUI, handleFileSelect, renderPreview, rmPendingImg, rmPdfPendente,
  addItem, anexar, rmPdf, editItem, salvarItem, delItem, agendarItem, salvarRev,
  toggleFolder, verDia, revItens, revAdd, rmRevAdd, salvRevEsp, fechaM, simGerar, simResp,
  simDescartar, simCorrigir, simRevisar, simApagar, iaTrocaProv, iaSalvar, iaRemover,
  iaTestar, setAcervoQ, lista, simAbrir, simFecharErro, confirmRmTag, salvaEditMat
});

render();
initFirebase();
</script>
