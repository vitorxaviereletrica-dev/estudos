<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudos – Eng. Civil</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14243b;--mut:#5d6b80;--bl:#1d4e89;--am:#f2a900;--rd:#b3261e;--ln:#d3dbe6;--gr:#2e9e5b}
@media(prefers-color-scheme:dark){
  :root{--bg:#0f1b2d;--card:#18283f;--ink:#e8eef7;--mut:#9fb0c7;--bl:#6fa8e8;--ln:#2b3f5c;--rd:#ff8a80}
  button{color:#0f1b2d}
  button.r{background:#c4453c;color:#fff}
  .c.ok b{color:#7ed99a}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
header{background:#1d4e89;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--am)}
#hd small{color:#cfe0f5}
#tb:empty{display:none}
#tb{margin-top:8px;background:var(--am);color:#14243b;border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap}
#tb button{background:#14243b;color:#fff}
main{max-width:900px;margin:0 auto;padding:8px 14px}
h2{font-size:1.05rem;margin:18px 0 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln)}
nav button{flex:1;padding:14px 2px;border:0;border-radius:0;background:none;color:var(--mut);font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on{color:var(--bl);font-weight:700;box-shadow:inset 0 3px var(--am)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.c.col{flex-direction:column;align-items:flex-start;gap:6px}
.c.ok{border-color:var(--gr);background:rgba(46,158,91,.13)}.c.ok b{color:var(--gr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.pb{height:8px;background:var(--ln);border-radius:4px;width:100%;overflow:hidden}
.pb i{display:block;height:100%;background:var(--am);transition:width .4s}.ok .pb i{background:var(--gr)}
.f{display:flex;gap:8px;flex-wrap:wrap}.f.col{flex-direction:column}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.f:not(.col) input{flex:1 1 160px;width:auto}.f:not(.col) select{width:auto}
button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:var(--bl);color:#fff;cursor:pointer}
button.s{padding:6px 10px;font-size:.85rem}button.r{background:var(--rd)}
.btn{display:inline-block;padding:10px 14px;border-radius:8px;background:var(--bl);color:#fff;cursor:pointer}
small,.vz{color:var(--mut)}.at{color:var(--rd);font-weight:700}
.cm{white-space:pre-wrap;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin:6px 0 0}
.chip{font-size:.72rem;padding:1px 8px;border-radius:12px;border:2px solid;background:var(--card);max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.urg{border-color:var(--rd)!important;color:var(--rd);font-weight:700}
.chip.urg::before{content:'⚠ '}
.gr{width:100%;display:block;color:var(--ink)}
a{color:var(--bl)}
label{display:flex;flex-direction:column;text-align:left;font-size:.85rem;color:var(--mut);gap:4px}
.dn{max-width:270px;margin:6px auto;color:var(--ink)}.dn svg{width:100%;display:block}
@media(min-width:520px){.dn{max-width:340px;margin:10px auto}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{padding:9px 0;border-radius:8px;position:relative;font-weight:400;cursor:pointer;background:var(--card);border:1px solid var(--ln);color:var(--ink)}
.cal button.hj{border-color:var(--am);font-weight:700}.cal button.sl{background:var(--bl);color:#fff;border-color:var(--bl)}
.cal u{position:absolute;left:50%;bottom:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--am)}.cal u.ok{background:var(--gr)}
.cal i{display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
.md{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--am);color:#14243b;font-weight:700;padding:10px 16px;border-radius:20px;display:none;z-index:40;text-align:center;max-width:92vw}

/* Estilos do Acervo em Árvore e Imagens */
details{margin:10px 0;background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
summary{padding:12px;cursor:pointer;font-weight:700;background:rgba(29,78,137,.06);display:flex;align-items:center;justify-content:space-between;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▶';font-size:.8em;margin-right:8px;color:var(--mut);transition:transform .2s}
details[open]>summary::before{transform:rotate(90deg)}
details[open]>summary{border-bottom:1px solid var(--ln)}
.tag-folder{margin:8px 12px;border-color:var(--am);border-radius:8px}
.tag-folder summary{background:rgba(242,169,0,.08);padding:8px 12px;font-size:.9em}
.item-acervo{border:none;border-bottom:1px solid var(--ln);border-radius:0;margin:0;padding:10px 12px}
.item-acervo:last-child{border-bottom:none}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumb{width:60px;height:60px;border-radius:6px;object-fit:cover;border:1px solid var(--ln);cursor:pointer;transition:transform .2s;background:#eee}
.thumb:hover{transform:scale(1.05)}
.paste-zone{border:2px dashed var(--bl);border-radius:8px;padding:15px;text-align:center;color:var(--bl);font-size:.9em;background:rgba(29,78,137,.05);margin-bottom:10px}
.paste-zone.hl{background:rgba(242,169,0,.2);border-color:var(--am)}
</style>
</head>
<body>
<header><div id="hd"></div><div id="tb"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<script>
const KEY='estudos_v1',BASE='estudos_base',NOME='controle-estudos-dados.json',GR='#2e9e5b';
const DC=['#e4572e','#f08a24','#c8403a','#f5b041'],TC=['#2e86ab','#5b9bd5','#3a6ea5','#6fb3b8'];
const DEF={materias:[],itens:[],agenda:[],estudo:{},hist:{},pastas:{},bonus:{},timer:null,ciclo:1,cicloInicio:'',xp:0,streak:0,ultimoDia:'',atualizado:0,cfg:{horas:10,pctDif:80}};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>fmtD(new Date());
function addD(iso,n){const p=iso.split('-').map(Number);return fmtD(new Date(p[0],p[1]-1,p[2]+n))}
const fb=iso=>iso.split('-').reverse().join('/');
const dif=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
function sem(){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return fmtD(x)}
function semanaDe(iso){const p=iso.split('-').map(Number);const x=new Date(p[0],p[1]-1,p[2]);x.setDate(x.getDate()-((x.getDay()+6)%7));return fmtD(x)}
function semanas(n){const o=[],b=sem();for(let i=n-1;i>=0;i--)o.push(addD(b,-7*i));return o}
function hm(ms){const t=Math.round(ms/6e4),h=Math.floor(t/60),m=t%60;return h?h+'h'+(m?pad(m):''):m+'min'}
function clk(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
const normStr = s => String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase();
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}

function norm(r){
  const d=Object.assign(clone(DEF),r);d.cfg=Object.assign({},DEF.cfg,r.cfg);
  ['materias','itens','agenda'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!d.estudo||typeof d.estudo!=='object')d.estudo={};
  const ks=Object.keys(d.estudo);
  if(ks.length&&ks.every(k=>/^\d{4}-\d{2}-\d{2}$/.test(k))){d.estudo=d.estudo[ks.sort().pop()]||{};d.bonus={}}
  if(!d.bonus||typeof d.bonus!=='object')d.bonus={};
  if(!d.hist||typeof d.hist!=='object')d.hist={};
  if(!d.pastas||typeof d.pastas!=='object')d.pastas={};
  if(!d.timer||typeof d.timer.mid!=='string'||!(d.timer.st>0))d.timer=null;
  else{
    if(typeof d.timer.acc!=='number')d.timer.acc=0;
    if(typeof d.timer.paused!=='boolean')d.timer.paused=false;
  }
  d.ciclo=Math.max(1,parseInt(d.ciclo)||1);d.atualizado=+d.atualizado||0;
  if(typeof d.cicloInicio!=='string')d.cicloInicio='';
  d.materias.forEach(m=>{
    if(m.dif!=='t')m.dif='d';
    if(!Array.isArray(m.difHist))m.difHist=[];
    if(typeof m.cor!=='string')m.cor='';
    if(!Array.isArray(m.tags))m.tags=[];
  });
  d.itens.forEach(i=>{
    if(typeof i.tag!=='string')i.tag='';
    if(!Array.isArray(i.imagens))i.imagens=[];
    // Segurança de ID no backup
    i.imagens = i.imagens.filter(img => img && /^[\w-]+$/.test(img.id));
  });
  const h=+d.cfg.horas;d.cfg.horas=h>0&&h<=100?h:10;
  const p=+d.cfg.pctDif;d.cfg.pctDif=p>=1&&p<=99?p:80;
  return d;
}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.materias)&&Array.isArray(r.itens))return norm(r)}catch(e){}
  return clone(DEF);
}
let S=load(),tab='ciclo',calM=hoje().slice(0,7),selD=hoje(),qAcervo='',pendingImages=[],pendingPdf=null;
let tok=null,fid=null,pronto=false,syncT=null,subindo=false,pend=false,expira=0,sujo=false,conectando=false,ultTent=0,msgSync='Drive: desconectado';
let openFolders = new Set();
let imgBlobCache = {};
const SCOPE='https://www.googleapis.com/auth/drive.file',RECON='Drive: reconecta ao tocar em qualquer botão';

function gravaLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Não consegui salvar neste aparelho. Faça um backup em Config > Exportar.')}}
function save(){
  S.atualizado=Date.now();gravaLocal();
  if(tok&&pronto){sujo=true;clearTimeout(syncT);syncT=setTimeout(subir,2000)}
  else if(localStorage.getItem('estudos_drive')){sujo=true;setMsg(RECON)}
}
const mat=id=>S.materias.find(m=>m.id===id);
const nivelXP=()=>Math.floor(S.xp/100)+1;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
function ganha(g){const a=nivelXP();S.xp+=g;const up=nivelXP()>a;if(up)fogos();return (g?'+'+g+' XP':'Tempo salvo')+(up?' · NÍVEL '+nivelXP()+'! 🎉':'')}
function streak(){const h=hoje();if(S.ultimoDia===h)return;S.streak=S.ultimoDia===addD(h,-1)?S.streak+1:1;S.ultimoDia=h}
function go(k){tab=k;if(k!=='acervo'){pendingImages=[];pendingPdf=null;}render()}

/* ---------- FOGOS ---------- */
function fogos(){
  if(!document.body||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:30';
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d');if(!x){c.remove();return}
  const P=[],t0=performance.now();let n=0;
  const burst=(cx,cy)=>{const h=Math.random()*360;for(let i=0;i<46;i++){const a=Math.PI*2*i/46,v=2+Math.random()*3.5;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:h+Math.random()*40})}};
  burst(c.width*.5,c.height*.35);
  (function f(t){
    const e=t-t0;
    if(n<4&&e>400*(n+1)){n++;burst(c.width*(.2+Math.random()*.6),c.height*(.15+Math.random()*.35))}
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.l-=.011;if(p.l>0){x.globalAlpha=p.l;x.fillStyle='hsl('+p.h+',100%,60%)';x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()}});
    if(e<2200||P.some(p=>p.l>0))requestAnimationFrame(f);else c.remove();
  })(t0);
}

/* ---------- CICLO ---------- */
function plano(){
  const a=S.materias.filter(m=>m.status==='andamento').sort((x,y)=>(x.dif==='d'?0:1)-(y.dif==='d'?0:1)||y.peso-x.peso);
  const nd=a.filter(m=>m.dif==='d').length,nt=a.length-nd;
  let pd=S.cfg.pctDif/100;if(!nd)pd=0;else if(!nt)pd=1;
  const H=S.cfg.horas;
  return {pd:pd,l:a.map(m=>({m:m,h:+(m.dif==='d'?H*pd/nd:H*(1-pd)/nt).toFixed(6)}))};
}
function novoCor(dif,excludeId){
  const pool=dif==='d'?DC:TC;const usados={};
  S.materias.forEach(m=>{if(m.id===excludeId)return;if(m.cor&&pool.includes(m.cor))usados[m.cor]=(usados[m.cor]||0)+1});
  let best=pool[0],minC=Infinity;
  pool.forEach(c=>{const n=usados[c]||0;if(n<minC){minC=n;best=c}});
  return best;
}
function cores(){
  const o={};let mudou=false;
  plano().l.forEach(p=>{if(!p.m.cor){p.m.cor=novoCor(p.m.dif,p.m.id);mudou=true}o[p.m.id]=p.m.cor});
  if(mudou)save();
  return o;
}
function timerElapsed(){
  if(!S.timer)return 0;
  if(S.timer.paused)return S.timer.acc||0;
  return (S.timer.acc||0)+(Date.now()-S.timer.st);
}
function est(id){
  let v=S.estudo[id]||0;
  if(S.timer&&S.timer.mid===id)v+=timerElapsed();
  return v;
}
function reg(id,ms){
  S.estudo[id]=(S.estudo[id]||0)+ms;
  const k=sem(),w=S.hist[k]=S.hist[k]||{};w[id]=(w[id]||0)+ms;
}
function chips(C){
  const h=hoje(),l=S.materias.filter(m=>m.status==='andamento'&&m.prova&&m.prova>=h).sort((a,b)=>a.prova.localeCompare(b.prova));
  if(!l.length)return '';
  return '<div class="chips">'+l.map(m=>{const n=dif(m.prova,h);const urg=n<=3?' urg':'';return '<span class="chip'+urg+'" title="Prova em '+fb(m.prova)+'" style="border-color:'+(C[m.id]||'#8895a7')+'">'+esc(m.nome)+' · '+(n===0?'hoje':n+' d')+'</span>'}).join('')+'</div>';
}
function metaCheck(m){
  const p=plano().l.find(x=>x.m.id===m.id);if(!p)return '';
  const k=S.ciclo+':'+m.id;
  if(est(m.id)>=p.h*36e5&&!S.bonus[k]){S.bonus[k]=1;fogos();return m.nome+': meta do ciclo batida! '+ganha(20*m.peso)}
  return '';
}
function fechaCiclo(){
  const P=plano().l;
  if(!P.length||!P.every(p=>est(p.m.id)>=p.h*36e5))return '';
  const n=S.ciclo; S.ciclo++;
  
  // ROLAGEM DE EXCEDENTE
  const newEstudo = {};
  P.forEach(p => {
    const meta = p.h * 36e5;
    const spent = est(p.m.id);
    if (spent > meta) newEstudo[p.m.id] = spent - meta;
  });
  S.estudo = newEstudo;
  
  S.cicloInicio=hoje();fogos();
  return 'Ciclo '+n+' concluído! 🏆 '+ganha(50);
}
function infoDif(m){
  const h=m.difHist&&m.difHist.length?m.difHist[m.difHist.length-1].data:'';
  if(!h)return '';
  const d=dif(hoje(),h);
  return d===0?' (hoje)':d===1?' (ontem)':' (há '+d+'d)';
}
function cardM(p,col){
  const m=p.m,meta=p.h*36e5,e=est(m.id),ok=e>=meta,pc=Math.min(100,Math.round(e/meta*100));
  const run=S.timer&&S.timer.mid===m.id;
  const paused=run&&S.timer.paused;
  const dtxt=m.dif==='d'?'🔥 dificuldade':'😌 tranquilo';
  const difInfo=infoDif(m);
  let tBtn;
  if(paused)tBtn='<button class="s" onclick="retomar()">▶ Retomar</button>';
  else if(run)tBtn='<button class="s" onclick="pausar()">⏸ Pausar</button>';
  else tBtn='<button class="s" onclick="iniciar(\''+m.id+'\')">▶ Estudar</button>';
  return '<div class="c col'+(ok?' ok':'')+'"><div class="row"><span class="dot" style="background:'+col+'"></span><b>'+esc(m.nome)+'</b><small>'+dtxt+difInfo+' · peso '+m.peso+'</small></div><div class="pb"><i style="width:'+pc+'%"></i></div><small>'+(ok?'✔ Estudado! ':'')+hm(e)+' de '+hm(meta)+(run&&!paused?' · ⏱ estudando agora':paused?' · ⏸ pausado':'')+'</small><span class="acts">'+tBtn+'<button class="s" onclick="tempoManual(\''+m.id+'\')">＋ Tempo</button><button class="s" onclick="agendar(\''+m.id+'\')">📅 Revisão</button><button class="s" onclick="reavaliar(\''+m.id+'\')">🔄 Reavaliar</button></span></div>';
}
function vCiclo(){
  const P=plano();
  if(!P.l.length)return '<p class="vz">Cadastre suas matérias na aba <b>Matérias</b>, informando o nível de dificuldade de cada uma.</p><button onclick="go(\'mat\')">＋ Cadastrar primeira matéria</button>';
  const H=S.cfg.horas,C=cores();let cum=0,svg='';const cols=[];
  P.l.forEach(p=>{
    const done=est(p.m.id)>=p.h*36e5,col=done?GR:C[p.m.id];
    cols.push(col);const pc=p.h/H*100,d=Math.max(pc-.6,.1);
    svg+='<circle r="15.915" cx="21" cy="21" fill="none" stroke="'+col+'" stroke-width="6" stroke-dasharray="'+d+' '+(100-d)+'" stroke-dashoffset="'+(25-cum)+'"/>';
    if(pc>=7){const a=(cum+pc/2)/100*Math.PI*2;svg+='<text x="'+(21+15.915*Math.sin(a)).toFixed(2)+'" y="'+(21-15.915*Math.cos(a)).toFixed(2)+'" text-anchor="middle" dominant-baseline="central" font-size="3" font-weight="700" fill="#fff">'+esc(p.m.nome.trim().slice(0,3).toUpperCase())+'</text>'}
    cum+=pc;
  });
  const txt='<text x="21" y="21" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor">'+(+H.toFixed(1))+'h</text><text x="21" y="26.5" text-anchor="middle" font-size="2.5" fill="currentColor">líquidas no ciclo</text>';
  const inicio=S.cicloInicio?(S.cicloInicio===hoje()?' · começou hoje':' · começou há '+dif(hoje(),S.cicloInicio)+' dia(s)'):'';
  return chips(C)+'<div class="dn"><svg viewBox="0 0 42 42">'+svg+txt+'</svg></div><p class="vz" style="text-align:center;margin:0">Ciclo nº '+S.ciclo+inicio+' · dificuldade '+Math.round(P.pd*100)+'% · tranquilo '+Math.round(100-P.pd*100)+'% · verde = meta batida</p><h2>Matérias do ciclo</h2>'+P.l.map((p,i)=>cardM(p,cols[i])).join('');
}

/* ---------- CRONÔMETRO ---------- */
function iniciar(id){
  if(S.timer&&S.timer.mid===id){if(S.timer.paused)retomar();return}
  if(S.timer){
    const n=(mat(S.timer.mid)||{nome:'?'}).nome;
    if(!confirm('Parar o cronômetro de "'+n+'" e iniciar outro?'))return;
    parar();
  }
  S.timer={mid:id,st:Date.now(),paused:false,acc:0};
  save();render();
}
function pausar(){
  if(!S.timer||S.timer.paused)return;
  S.timer.acc+=(Date.now()-S.timer.st);
  S.timer.paused=true;
  const m=mat(S.timer.mid);const msg=m?metaCheck(m):'';
  save();render();
  if(msg)toast(msg);
}
function retomar(){
  if(!S.timer||!S.timer.paused)return;
  S.timer.st=Date.now();S.timer.paused=false;
  save();render();
}
function parar(){
  if(!S.timer)return;
  const m=mat(S.timer.mid),msgs=[];
  let e=S.timer.paused?(S.timer.acc||0):((S.timer.acc||0)+(Date.now()-S.timer.st));
  if(e>4*36e5&&!confirm('O cronômetro ficou ligado por '+hm(e)+'. Salvar esse tempo todo?'))e=0;
  S.timer=null;
  if(m&&e>=1000){reg(m.id,e);if(e>=6e4)streak();msgs.push(ganha(Math.floor(e/6e5)*m.peso),metaCheck(m))}
  msgs.push(fechaCiclo());
  save();render();
  const t=msgs.filter(Boolean).join(' · ');
  if(t)toast(t);
}
function tbar(){
  if(!S.timer)return '';
  const m=mat(S.timer.mid);if(!m)return '';
  const ic=S.timer.paused?'⏸':'⏱';
  const est=S.timer.paused?' pausado':'';
  const btn=S.timer.paused
    ?'<button class="s" onclick="retomar()">▶ Retomar</button>'
    :'<button class="s" onclick="pausar()">⏸ Pausar</button>';
  return '<span>'+ic+' <b>'+esc(m.nome)+'</b> <span id="tv">'+clk(timerElapsed())+'</span>'+est+'</span>'+btn+' <button class="s r" onclick="parar()">⏹ Parar</button>';
}
function tick(){
  if(!S.timer||S.timer.paused)return;
  const m=mat(S.timer.mid);if(!m){S.timer=null;save();render();return}
  const tv=$('#tv');if(tv)tv.textContent=clk(timerElapsed());
  const msg=metaCheck(m);if(msg){save();render();toast(msg)}
}

/* ---------- GRÁFICOS ---------- */
function barras(v,W8,col){
  const bw=26,gap=10,H=100,x0=8,mx=Math.max.apply(null,v.concat([1]));let b='';
  v.forEach((x,i)=>{
    const bh=x/mx*H,xx=x0+i*(bw+gap),cx=xx+bw/2;
    if(x>0) b+='<rect x="'+xx+'" y="'+(14+H-bh).toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+col+'"/>';
    else b+='<rect x="'+xx+'" y="'+(14+H-1.5)+'" width="'+bw+'" height="1.5" rx="1" fill="'+col+'" opacity="0.3"/>';
    if(x>0)b+='<text x="'+cx+'" y="'+(11+H-bh).toFixed(1)+'" text-anchor="middle" font-size="9" fill="currentColor">'+(+x.toFixed(1))+'h</text>';
    b+='<text x="'+cx+'" y="'+(H+27)+'" text-anchor="middle" font-size="8" fill="#8895a7">'+W8[i].slice(8)+'/'+W8[i].slice(5,7)+'</text>';
  });
  return '<svg class="gr" viewBox="0 0 '+(x0*2+v.length*(bw+gap)-gap)+' '+(H+32)+'"><line x1="0" x2="'+(x0*2+v.length*(bw+gap)-gap)+'" y1="'+(14+H)+'" y2="'+(14+H)+'" stroke="#8895a7" stroke-width=".5"/>'+b+'</svg>';
}
function vGraf(){
  const ms=S.materias.filter(m=>m.status==='andamento'||Object.keys(S.hist).some(k=>(S.hist[k][m.id]||0)>0));
  if(!ms.length)return '<p class="vz">Cadastre matérias e estude com o cronômetro para ver os gráficos.</p><button onclick="go(\'mat\')">＋ Cadastrar matéria</button>';
  const W8=semanas(8),C=cores(),cur=sem();
  return '<h2>Horas por semana</h2><p class="vz" style="margin:0">Últimas 8 semanas (a semana começa na segunda). A última barra é a semana atual.</p>'+ms.map(m=>{
    const col=C[m.id]||'#8895a7';
    const v=W8.map(w=>((S.hist[w]||{})[m.id]||0)/36e5+(w===cur&&S.timer&&S.timer.mid===m.id?timerElapsed()/36e5:0));
    const tot=v.reduce((a,b)=>a+b,0);
    return '<div class="c col"><div class="row"><span class="dot" style="background:'+col+'"></span><b>'+esc(m.nome)+'</b></div>'+barras(v,W8,col)+'<small>Total: '+hm(tot*36e5)+' · média '+hm(tot/8*36e5)+'/semana · estudou em '+v.filter(x=>x>0).length+' de 8 semanas</small></div>';
  }).join('');
}

function handleFileSelect(e) {
  Array.from(e.target.files).forEach(f => {

      const r = new FileReader();
      r.onload = ev => { pendingImages.push({file: f, b64: ev.target.result}); renderPreview(); };
      r.readAsDataURL(f);

    }
  });
  renderPreview();

document.addEventListener('paste', e => {
  if (tab !== 'acervo') return;
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  let hasImage = false;
  for (let index in items) {
    const item = items[index];
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      hasImage = true;
      const blob = item.getAsFile();
      const r = new FileReader();
      r.onload = ev => { pendingImages.push({ file: blob, b64: ev.target.result }); renderPreview(); };
      r.readAsDataURL(blob);
    }
  }
  if (hasImage) e.preventDefault();
});

        normStr((i.titulo||'')+' '+(i.com||'')+' '+(i.rev||'')+' '+(i.feitas||'')).includes(q)
      ).sort((a,b) => (a.titulo||'').localeCompare(b.titulo||'', undefined, { numeric: true, sensitivity: 'base' }));

      if (q && !itensFiltrados.length && !normStr(tagName).includes(q)) return '';
      if (itensFiltrados.length) temMatch = true;

      const isOpen = openFolders.has('tag_'+m.id+'_'+tagName) || (q ? ' open' : '');
      return `<details class="tag-folder" ${isOpen?'open':''} ontoggle="toggleFolder('tag', '${m.id}_${tagName}', this.open)">
        <summary>🏷️ ${esc(tagName)} (${itens.length})</summary>
        <div>${itensFiltrados.map(renderItem).join('')}</div>
      </details>`;
    };

    const comTag = Object.keys(grupos).filter(k => k !== 'Sem Tag').sort();
    let inner = comTag.map(t => renderGrupo(t, grupos[t])).join('');
    if (grupos['Sem Tag']) inner += renderGrupo('Sem Tag', grupos['Sem Tag']);

    if (temMatch || (q && normStr(m.nome).includes(q))) {
      const isOpen = openFolders.has('mat_'+m.id) || (q ? ' open' : '');
      html += `<details class="materia-folder" ${isOpen?'open':''} ontoggle="toggleFolder('mat', '${m.id}', this.open)">
        <summary>📚 ${esc(m.nome)} ${m.status === 'concluida' ? '(Concluída)' : ''}</summary>
        <div style="padding:8px">${inner}</div>
      </details>`;
    }
  };

  S.materias.forEach(renderMateria);

  // Tratamento de Itens Órfãos
  const orphans = S.itens.filter(i => !validMids.has(i.mid));
  if (orphans.length) {
    const mItens = orphans;
    const grupos = {};
    mItens.forEach(i => {
      const t = i.tag || 'Sem Tag';
      if (!grupos[t]) grupos[t] = [];
      grupos[t].push(i);
    });
    let inner = '';
    for (const t of Object.keys(grupos).sort()) {
      const itensFiltrados = grupos[t].filter(i => normStr((i.titulo||'')+' '+(i.com||'')).includes(q)).sort((a,b) => (a.titulo||'').localeCompare(b.titulo||'', undefined, { numeric: true }));
      if (q && !itensFiltrados.length) continue;
      const isOpen = openFolders.has('tag_orphan_'+t) || (q ? ' open' : '');
      inner += `<details class="tag-folder" ${isOpen?'open':''} ontoggle="toggleFolder('tag', 'orphan_${t}', this.open)"><summary>🏷️ ${esc(t)}</summary><div>${itensFiltrados.map(renderItem).join('')}</div></details>`;
    }
    if (inner) {
      const isOpen = openFolders.has('mat_orphan') || (q ? ' open' : '');
      html += `<details class="materia-folder" ${isOpen?'open':''} ontoggle="toggleFolder('mat', 'orphan', this.open)"><summary>📚 ⚠️ Atividades sem Matéria (Antigas)</summary><div style="padding:8px">${inner}</div></details>`;
    }
  }

  el.innerHTML = html || '<p class="vz">Nada por aqui ainda.</p>';

  // Resolver thumbnails do Drive de forma segura (contornando bloqueios do Safari)
  document.querySelectorAll('img[data-imgid]').forEach(async (imgEl) => {
    const id = imgEl.dataset.imgid;
    if(imgBlobCache[id]) { imgEl.src = imgBlobCache[id]; return; }
    if(tok && pronto) {
      try {
        const r = await drv('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        imgBlobCache[id] = url;
        imgEl.src = url;
      } catch(e) { /* fallback para link direto se falhar */ }
    }
  });
}

/* COMPRESSÃO DE IMAGEM */
async function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        const MAX = 1600;
        if (width > MAX || height > MAX) {
          if (width > height) { height = Math.round((height * MAX) / width); width = MAX; }
          else { width = Math.round((width * MAX) / height); height = MAX; }
        }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg' })), 'image/jpeg', 0.8);
      };
    };
  });
}

const CID='9771256176-euuvbk32c7lefjb79bkpvmo8shhcvo2d.apps.googleusercontent.com';

function setMsg(t){msgSync=t;document.querySelectorAll('.sy').forEach(e=>e.textContent=t)}
function drv(url,opt){
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+tok},opt.headers||{});
  return fetch(url,opt).then(r=>{
    if(r.status===401){tok=null;pronto=false;expira=0;setMsg(RECON)}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r;
  });
}
function conectar(modo,troca){
  if(!window.google||!google.accounts){if(modo==='manual')toast('O login do Google não carregou. Abra o app pelo endereço https:// (hospedado) e com internet.');return}
  if(modo!=='manual'){if(conectando||Date.now()-ultTent<60000)return;ultTent=Date.now()}
  if(troca){localStorage.removeItem('estudos_hint');fid=null;pronto=false}
  conectando=true;setTimeout(()=>{conectando=false},20000);
  const hint=localStorage.getItem('estudos_hint')||'';
  const tc=google.accounts.oauth2.initTokenClient({
    client_id:cid(),scope:SCOPE,
    callback:async r=>{
      conectando=false;
      if(r.error){setMsg(modo==='manual'?'Drive: não conectou ('+r.error+')':RECON);return}
      tok=r.access_token;expira=Date.now()+(+r.expires_in||3600)*1000;localStorage.setItem('estudos_drive','1');
      if(!hint){try{const u=await (await drv('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json();if(u.user&&u.user.emailAddress)localStorage.setItem('estudos_hint',u.user.emailAddress)}catch(e){}}
      puxar();
    },
    error_callback:()=>{conectando=false;if(modo==='manual')toast('Login cancelado ou bloqueado pelo navegador');else setMsg(RECON)}
  });
  const ov={prompt:modo==='auto'?'none':(hint?'':'select_account')};if(hint)ov.hint=hint;
  tc.requestAccessToken(ov);
}
function desconectar(){tok=null;fid=null;pronto=false;sujo=false;expira=0;localStorage.removeItem('estudos_drive');localStorage.removeItem('estudos_hint');setMsg('Drive: desconectado')}
async function puxar(quiet){
  if(!quiet)setMsg('Drive: sincronizando…');
  try{
    const q=encodeURIComponent("name='"+NOME+"' and trashed=false");
    const l=await (await drv('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)&pageSize=1')).json();
    const base=+localStorage.getItem(BASE)||0;
    if(!l.files||!l.files.length){fid=null;pronto=true;await subir();return}
    fid=l.files[0].id;
    const rem=await (await drv('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media')).json();
    if(!rem||!Array.isArray(rem.materias)||!Array.isArray(rem.itens))throw new Error('arquivo do Drive inválido');
    const ra=+rem.atualizado||0,rc=ra>base,lc=(S.atualizado||0)>base;
    let usar=rc&&!lc;
    if(rc&&lc){if(quiet)return;usar=confirm('O Drive e este aparelho têm alterações diferentes.\n\nOK = usar os dados do Drive (descarta os daqui)\nCancelar = manter os daqui (sobrescreve o Drive)')}
    if(usar){const t=S.timer;S=norm(rem);S.timer=t;sujo=false;gravaLocal();localStorage.setItem(BASE,String(ra));pronto=true;render();setMsg('Drive: dados carregados ✔');return}
    pronto=true;
    if(lc)await subir();else if(!quiet)setMsg('Drive: sincronizado ✔');
  }catch(e){if(tok)setMsg('Drive: erro ao sincronizar ('+e.message+')')}
}
async function subir(){
  if(!tok||!pronto)return;
  if(subindo){pend=true;return}
  subindo=true;setMsg('Drive: salvando…');
  const d=clone(S);d.timer=null;const body=JSON.stringify(d);
  try{
    if(!fid){
      const b='estudosfronteira';
      const r=await drv('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:'--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({name:NOME,mimeType:'application/json'})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'});
      fid=(await r.json()).id;
    }else{
      try{
        await drv('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
      }catch(e){
        if(/HTTP 404/.test(e.message)){
          fid=null;subindo=false;setMsg('Drive: arquivo sumiu, recriando…');return subir();
        }
        throw e;
      }
    }
    localStorage.setItem(BASE,String(d.atualizado));sujo=S.atualizado>d.atualizado;setMsg('Drive: sincronizado ✔');
  }catch(e){if(tok)setMsg('Drive: falha ao salvar (tento de novo na próxima alteração)')}
  subindo=false;if(pend){pend=false;subir()}
}
async function pasta(nome,pai,chave){
  const ex=S.pastas[chave];
  if(ex){try{const r=await (await drv('https://www.googleapis.com/drive/v3/files/'+ex+'?fields=id,trashed')).json();if(r&&!r.trashed)return ex}catch(e){if(!tok)throw e}}
  const q="name='"+nome.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false"+(pai?" and '"+pai+"' in parents":'');
  const l=await (await drv('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id)&pageSize=1')).json();
  let id=l.files&&l.files[0]&&l.files[0].id;
  if(!id){
    const r=await drv('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nome,mimeType:'application/vnd.google-apps.folder',parents:pai?[pai]:undefined})});
    id=(await r.json()).id;
  }
  S.pastas[chave]=id;save();return id;
}
async function enviarArquivo(file,m){
  if(!tok||!pronto)throw new Error('conecte ao Drive em Config');
  if(file.size>150*1048576)throw new Error('o arquivo passa de 150 MB');
  const raiz=await pasta('Controle de Estudos',null,'raiz'),pa=await pasta(m.nome,raiz,m.id);
  const meta=JSON.stringify({name:file.name,parents:[pa],mimeType:file.type||'application/octet-stream'});
  let r;
  if(file.size<=4.5*1048576){
    const b='estudosfronteirafile';
    r=await drv('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: '+(file.type||'application/octet-stream')+'\r\n\r\n',file,'\r\n--'+b+'--'])});
  }else{
    const ini=await drv('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id',{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':file.type||'application/octet-stream'},body:meta});
    const loc=ini.headers.get('Location');if(!loc)throw new Error('o Drive não devolveu o endereço de envio');
    r=await fetch(loc,{method:'PUT',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});
    if(!r.ok)throw new Error('HTTP '+r.status);
  }
  const j=await r.json();if(!j.id)throw new Error('resposta sem ID');
  return {id:j.id,nome:file.name};
}

function tickSync(){
  if(!tok||!pronto||sujo||subindo||document.visibilityState!=='visible'||Date.now()>expira-60000)return;
  const t=document.activeElement&&document.activeElement.tagName;if(/^(INPUT|TEXTAREA|SELECT)$/.test(t||''))return;

    if(!localStorage.getItem('estudos_drive')||(tok&&Date.now()<expira-300000))return;

  if(!/^https?:$/.test(location.protocol))return;
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
  s.onload=()=>{if(localStorage.getItem('estudos_drive')){setMsg('Drive: reconectando…');conectar('auto')}};

  return '<h2>Ciclo de estudos</h2><div class="f col"><label>Horas líquidas de estudo em um ciclo<input id="ch" type="number" step="0.5" min="1" max="100" value="'+S.cfg.horas+'"></label><label>% do tempo para matérias com dificuldade (o resto vai para as tranquilas)<input id="cp" type="number" min="1" max="99" value="'+S.cfg.pctDif+'"></label><button onclick="saveCfg()">Salvar</button></div><p class="vz">O ciclo só reinicia quando todas as matérias baterem a meta. Mudar as horas nunca apaga o que você já estudou.</p>'
   +'<h2>Google Drive</h2><p class="vz sy">'+esc(msgSync)+'</p><p class="vz" style="margin:0">ID do cliente embutido no app: '+esc(CID.slice(0,10))+'…</p><div class="f col"><div class="f"><button onclick="conectar(\'manual\')">Conectar ao Drive</button><button class="s" onclick="conectar(\'manual\',true)">Trocar de conta</button><button class="r" onclick="desconectar()">Desconectar</button></div></div><p class="vz">Salva o arquivo '+NOME+' no seu Drive a cada alteração. Funciona só com o app aberto por um endereço https://. O Google libera o acesso por 1 hora de cada vez: o app renova sozinho quando você toca em qualquer botão (uma janelinha pode piscar). Enquanto isso, as alterações ficam guardadas no aparelho e sobem na reconexão.</p>'
   +'<h2>Backup manual</h2><button onclick="exp()">Exportar JSON</button> <label class="btn" style="display:inline-block;color:#fff">Importar<input type="file" accept=".json,application/json" hidden onchange="imp(event)"></label>'
   +'<h2>Começar do zero</h2><p class="vz">Apaga matérias, atividades, revisões, horas, gráficos e XP (mantém suas horas do ciclo e a conexão com o Drive). Baixa um backup antes. Se o Drive estiver conectado, o arquivo dele também é zerado, e os outros aparelhos recebem o app vazio ao sincronizar. PDFs e imagens já enviados ficam no Drive.</p><button class="r" onclick="zerar()">Zerar tudo</button>';
}
function zerar(){
  if(!confirm('Apagar TODAS as matérias, atividades, revisões, horas e XP'+(tok?' e também zerar o arquivo do Drive':'')+'?\n\nUm backup será baixado antes.'))return;
  if(!confirm('Tem certeza? Isso não pode ser desfeito.'))return;
  exp();
  const cfg=S.cfg,pastas=S.pastas;
  S=clone(DEF);S.cfg=cfg;S.pastas=pastas;
  tab='ciclo';save();render();toast('Tudo zerado. Pode começar!');
}
function saveCfg(){
  const h=+$('#ch').value,p=Math.round(+$('#cp').value);
  if(!(h>0&&h<=100)||!(p>=1&&p<=99)){toast('Horas entre 1 e 100 e porcentagem entre 1 e 99');return}
  S.cfg.horas=h;S.cfg.pctDif=p;const t=fechaCiclo();save();render();toast(t||'Ciclo atualizado');
}
function exp(){
  const d=clone(S);d.timer=null;
  const b=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='estudos-backup-'+hoje()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function imp(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.materias)||!Array.isArray(d.itens))throw new Error();
      if(!confirm('Substituir os dados atuais pelos do arquivo?'))return;
      const t=S.timer;S=norm(d);S.timer=t;save();render();toast('Backup importado');
    }catch(x){alert('Arquivo inválido.')}
  };
  r.readAsText(f);e.target.value='';
}

/* ---------- RENDER ---------- */
function render(){
  const h=hoje(),sq=(S.ultimoDia===h||S.ultimoDia===addD(h,-1))?S.streak:0;
  $('#hd').innerHTML='<b>Nível '+nivelXP()+'</b> · '+S.xp+' XP · 🔥 '+sq+' dia(s) seguidos<div class="bar"><i style="width:'+(S.xp%100)+'%"></i></div><small class="sy">'+esc(msgSync)+'</small>';
  $('#tb').innerHTML=tbar();
  $('#nav').innerHTML=[['ciclo','📚 Ciclo'],['agenda','📅 Agenda'],['mat','📋 Matérias'],['acervo','📁 Acervo'],['graf','📊 Gráficos'],['cfg','⚙ Config']].map(a=>'<button class="'+(tab===a[0]?'on':'')+'" onclick="go(\''+a[0]+'\')">'+a[1]+'</button>').join('');
  $('#app').innerHTML={ciclo:vCiclo,agenda:vAgenda,mat:vMat,acervo:vAcervo,graf:vGraf,cfg:vCfg}[tab]();
  
  if(tab==='acervo') {
    updateTagsSelect();
    renderPreview();
    lista();
    
    const pz = $('#paste-zone');
    if(pz) {
      pz.onclick = () => $('#ap').click();
      pz.ondragover = e => { e.preventDefault(); pz.classList.add('hl'); };
      pz.ondragleave = () => pz.classList.remove('hl');
      pz.ondrop = e => {
        e.preventDefault(); pz.classList.remove('hl');
        handleFileSelect({target: {files: e.dataTransfer.files, value: ''}});
      };
    }
  }
}
render();initDrive();
</script>
</body>
</html>
